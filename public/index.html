<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>One Horizon webhook receiver</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f3;
        color: #20201d;
      }

      main {
        width: min(90vw, 520px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 16px;
        line-height: 1.55;
      }

      code {
        padding: 3px 6px;
        border-radius: 4px;
        background: #ecece5;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #151514;
          color: #f4f4ef;
        }

        code {
          background: #30302c;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>One Horizon webhook receiver</h1>
      <p>This Vercel project is ready to receive One Horizon app webhooks.</p>
      <p>Use <code>/webhook</code> as the endpoint in One Horizon.</p>
    </main>
  </body>
</html>
